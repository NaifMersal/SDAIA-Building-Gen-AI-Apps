<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HNSW Search — Interactive Demo</title>
<style>
  /* ---- SDAIA palette (hardcoded: CSS vars don't cross the iframe boundary) ---- */
  :root{
    --navy:#1C355E; --teal:#00C9A7; --coral:#FF7A5C; --purple:#9B8EC0;
    --muted:#5b6678; --panel:#f7f9fc; --border:#dbe2ea; --ink:#101820;
    --base:#c2cbd6;     /* inactive node */
    --visited:#7fd9c6;  /* visited node  */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:#fff; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ---- control bar ---- */
  #bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
    padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .seg{display:inline-flex; border:1px solid var(--navy); border-radius:8px; overflow:hidden}
  .seg button{
    border:0; background:#fff; color:var(--navy); padding:6px 12px; cursor:pointer;
    font-size:13px; font-weight:600;
  }
  .seg button.on{background:var(--navy); color:#fff}
  .ctrl{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .ctrl input[type=range]{width:104px; accent-color:var(--coral)}
  .ctrl b{font-variant-numeric:tabular-nums; color:var(--navy); min-width:22px; display:inline-block}
  .btn{
    border:1px solid var(--border); background:#fff; color:var(--navy); border-radius:8px;
    padding:6px 11px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .btn:hover{background:var(--panel)}
  .btn.primary{background:var(--coral); border-color:var(--coral); color:#fff}
  .btn:disabled{opacity:.45; cursor:default}
  .spacer{flex:1 1 auto}
  /* ---- canvas ---- */
  #stage{position:relative; flex:1 1 auto; min-height:0; background:#fff}
  canvas{position:absolute; inset:0; width:100%; height:100%; cursor:crosshair}
  /* ---- caption / legend ---- */
  #foot{
    border-top:1px solid var(--border); padding:7px 12px; font-size:12.5px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel);
  }
  #caption{color:var(--navy); font-weight:600}
  #stepc{color:var(--muted); font-variant-numeric:tabular-nums}
  .legend{display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); margin-left:auto}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .dot{width:11px; height:11px; border-radius:50%; display:inline-block}
</style>
</head>
<body>
  <div id="bar">
    <div class="ctrl">
      <span class="seg" id="viewSeg">
        <button data-view="space" class="on">Embedding Space</button>
        <button data-view="layers">HNSW Layers</button>
      </span>
    </div>
    <div class="ctrl">N <input id="n" type="range" min="20" max="120" step="5" value="60"><b id="nv">60</b></div>
    <div class="ctrl">M <input id="m" type="range" min="2" max="24" step="1" value="8"><b id="mv">8</b></div>
    <div class="ctrl">ef_search <input id="ef" type="range" min="1" max="60" step="1" value="20"><b id="efv">20</b></div>
    <div class="ctrl">k <input id="k" type="range" min="1" max="10" step="1" value="5"><b id="kv">5</b></div>
    <span class="spacer"></span>
    <button class="btn" id="reset" title="Back to the entry point">↺ Reset</button>
    <button class="btn primary" id="step">▸ Step</button>
    <button class="btn" id="play">⏵ Play</button>
    <button class="btn" id="rebuild" title="New random graph">⟳ Rebuild</button>
  </div>

  <div id="stage"><canvas id="cv"></canvas></div>

  <div id="foot">
    <span id="stepc"></span>
    <span id="caption">Drag the ✕ query anywhere. Press <b>Step</b> to walk the search.</span>
    <span class="legend">
      <span><i class="dot" style="background:#1C355E"></i>query</span>
      <span><i class="dot" style="background:#FF7A5C"></i>current</span>
      <span><i class="dot" style="background:#9B8EC0"></i>candidate</span>
      <span><i class="dot" style="background:#7fd9c6"></i>visited</span>
      <span><i class="dot" style="background:#00C9A7"></i>top-k</span>
    </span>
  </div>

<script>
"use strict";
// ===================== state =====================
const C = {navy:"#1C355E", teal:"#00C9A7", coral:"#FF7A5C", purple:"#9B8EC0",
           muted:"#5b6678", base:"#c2cbd6", visited:"#7fd9c6", border:"#dbe2ea"};
let view = "space";          // "space" | "layers"
let nodes = [];              // {id,x,y,level,nbr:[Set per layer]}
let topLayer = 0;
let entry = 0;               // entry-point id
let query = {x:0.78, y:0.30};
let steps = [];              // animation timeline
let cur = 0;                 // current step index
let timer = null;            // play interval
let seed = 12345;

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

// ---- seeded RNG (mulberry32) so Rebuild is reproducible ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const D = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);          // node↔node
const Dq = id => Math.hypot(nodes[id].x-query.x, nodes[id].y-query.y); // node↔query

// ===================== build the HNSW graph =====================
function build(){
  const rng = mulberry32(seed);
  const N = +$("n").value, M = +$("m").value;
  const mL = 1/Math.log(M);                 // level normalisation (classic HNSW)
  const CAP = 4;                            // cap layers so the stacked view stays legible
  nodes = [];
  for(let i=0;i<N;i++) nodes.push({id:i, x:rng(), y:rng(), level:0, nbr:[]});
  for(const p of nodes){
    p.level = Math.min(CAP, Math.floor(-Math.log(rng()+1e-12)*mL));
  }
  topLayer = nodes.reduce((m,p)=>Math.max(m,p.level), 0);
  entry = nodes.reduce((e,p)=> p.level>nodes[e].level ? p.id : e, 0);

  // connect each layer: every node links to its nearest neighbours present at that layer
  for(let L=0; L<=topLayer; L++){
    const here = nodes.filter(p=>p.level>=L);
    const Mmax = (L===0)? 2*M : M;          // base layer is denser (HNSW convention)
    for(const p of here){ if(!p.nbr[L]) p.nbr[L] = new Set(); }
    for(const p of here){
      const near = here.filter(q=>q!==p).sort((a,b)=>D(p,a)-D(p,b)).slice(0,Mmax);
      for(const q of near){ p.nbr[L].add(q.id); q.nbr[L].add(p.id); }
    }
    // prune back to Mmax (bidirectional adds can overflow) — keep the closest
    for(const p of here){
      if(p.nbr[L].size>Mmax){
        p.nbr[L] = new Set([...p.nbr[L]].sort((a,b)=>D(p,nodes[a])-D(p,nodes[b])).slice(0,Mmax));
      }
    }
  }
  runSearch();
}

// ===================== instrumented search =====================
function nbrsAt(id,L){ return nodes[id].nbr[L] ? [...nodes[id].nbr[L]] : []; }

function runSearch(){
  steps = [];
  const k = +$("k").value;
  const ef = Math.min(+$("ef").value, nodes.length);
  let curId = entry;
  steps.push({phase:"start", layer:topLayer, current:curId, evaluated:[], visited:[curId],
              candidates:[], results:[], caption:`Enter at the top — Layer ${topLayer}, ${nodes.filter(n=>n.level>=topLayer).length} node(s). ${topLayer+1} layers total.`});

  // ---- greedy descent through the upper layers ----
  for(let L=topLayer; L>=1; L--){
    let improved = true;
    while(improved){
      improved = false;
      const ev = nbrsAt(curId,L);
      let best=curId, bd=Dq(curId);
      for(const nb of ev){ const d=Dq(nb); if(d<bd){bd=d; best=nb;} }
      if(best!==curId){
        steps.push({phase:"greedy", layer:L, current:curId, moveTo:best, evaluated:ev,
                    visited:[curId,best], candidates:[], results:[],
                    caption:`Layer ${L}: a neighbour is closer to the query → hop to it.`});
        curId = best; improved = true;
      } else {
        steps.push({phase:"descend", layer:L, current:curId, evaluated:ev,
                    visited:[curId], candidates:[], results:[],
                    caption:`Layer ${L}: no neighbour is closer → descend to Layer ${L-1}.`});
      }
    }
  }

  // ---- base layer: ef beam search ----
  let visited = new Set([curId]);
  let cand = [curId];
  let res  = [curId];
  steps.push({phase:"beam", layer:0, current:curId, evaluated:[], visited:[...visited],
              candidates:[...cand], results:[...res],
              caption:`Layer 0: start the fine search, keeping the ${ef} best (ef_search=${ef}).`});
  while(cand.length){
    cand.sort((a,b)=>Dq(a)-Dq(b));
    const c = cand.shift();
    const furthest = Math.max(...res.map(Dq));
    if(Dq(c) > furthest && res.length>=ef) break;   // nothing closer left to explore
    const ev = nbrsAt(c,0);
    for(const nb of ev){
      if(visited.has(nb)) continue;
      visited.add(nb);
      const f = res.length ? Math.max(...res.map(Dq)) : Infinity;
      if(res.length<ef || Dq(nb)<f){
        cand.push(nb); res.push(nb);
        if(res.length>ef){ res.sort((a,b)=>Dq(a)-Dq(b)); res = res.slice(0,ef); }
      }
    }
    steps.push({phase:"beam", layer:0, current:c, evaluated:ev, visited:[...visited],
                candidates:[...cand], results:[...res],
                caption:`Layer 0: expand the closest candidate, add its unseen neighbours.`});
  }

  const top = [...res].sort((a,b)=>Dq(a)-Dq(b)).slice(0,k);
  steps.push({phase:"final", layer:0, current:top[0], evaluated:[], visited:[...visited],
              candidates:[], results:top,
              caption:`Done — returned the top-${k} nearest neighbours (explored ${visited.size} of ${nodes.length} nodes).`});

  cur = Math.min(cur, steps.length-1);
}

// ===================== geometry =====================
function plotBox(){ const pad=26; return {x:pad, y:pad, w:cv.clientW-2*pad, h:cv.clientH-2*pad}; }
function spacePx(p){ const b=plotBox(); return [b.x+p.x*b.w, b.y+p.y*b.h]; }
function layerBox(L){ const b=plotBox(); const rows=topLayer+1; const h=b.h/rows;
  const top=b.y+(topLayer-L)*h; return {x:b.x, y:top, w:b.w, h:h}; }
function layerPx(id,L){ const lb=layerBox(L); const p=nodes[id];
  return [lb.x+p.x*lb.w, lb.y+lb.h*0.18+p.y*lb.h*0.64]; }

// ===================== rendering =====================
function nodeColor(id, s){
  if(s.results.includes(id)) return C.teal;
  if(id===s.current) return C.coral;
  if(s.candidates.includes(id)) return C.purple;
  if(s.visited.includes(id)) return C.visited;
  return C.base;
}
function draw(){
  const dpr = window.devicePixelRatio||1;
  cv.clientW = cv.clientWidth; cv.clientH = cv.clientHeight;
  cv.width = cv.clientW*dpr; cv.height = cv.clientH*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.clientW,cv.clientH);
  const s = steps[cur] || {current:entry,evaluated:[],visited:[],candidates:[],results:[],layer:topLayer};
  (view==="space" ? drawSpace : drawLayers)(s);
}

function drawSpace(s){
  const b = plotBox();
  // faint base-layer edges for context
  ctx.strokeStyle = "rgba(120,130,150,0.10)"; ctx.lineWidth = 1;
  for(const p of nodes){ for(const q of nbrsAt(p.id,0)){ if(q>p.id){
    const [ax,ay]=spacePx(p), [bx,by]=spacePx(nodes[q]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }}}
  // emphasise edges of the active layer out of the current node
  ctx.strokeStyle = "rgba(28,53,94,0.55)"; ctx.lineWidth = 1.6;
  for(const q of nbrsAt(s.current, s.layer)){
    const [ax,ay]=spacePx(nodes[s.current]), [bx,by]=spacePx(nodes[q]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  // nodes
  for(const p of nodes){
    const [x,y]=spacePx(p); const col=nodeColor(p.id,s);
    const big = p.id===s.current || s.results.includes(p.id);
    ctx.beginPath(); ctx.arc(x,y,big?7:4,0,7); ctx.fillStyle=col; ctx.fill();
    if(s.results.includes(p.id)){ ctx.lineWidth=2; ctx.strokeStyle=C.navy; ctx.stroke(); }
  }
  // line current → query
  const [cx,cy]=spacePx(nodes[s.current]);
  drawQuery(cx,cy);
}

function drawLayers(s){
  const b = plotBox();
  for(let L=topLayer; L>=0; L--){
    const lb = layerBox(L);
    const active = (s.layer===L);
    // band
    ctx.fillStyle = active ? "rgba(255,122,92,0.07)" : "rgba(28,53,94,0.035)";
    ctx.fillRect(lb.x-12, lb.y+2, lb.w+24, lb.h-4);
    ctx.strokeStyle = C.border; ctx.lineWidth=1;
    ctx.strokeRect(lb.x-12, lb.y+2, lb.w+24, lb.h-4);
    ctx.fillStyle = active ? C.coral : C.muted; ctx.font="600 12px sans-serif"; ctx.textBaseline="top";
    ctx.fillText(L===0?"Layer 0 (base)":`Layer ${L}`, lb.x-6, lb.y+6);
    // edges within band
    const here = nodes.filter(p=>p.level>=L);
    ctx.strokeStyle = active ? "rgba(28,53,94,0.30)" : "rgba(120,130,150,0.16)"; ctx.lineWidth=1;
    for(const p of here){ for(const q of nbrsAt(p.id,L)){ if(q>p.id){
      const [ax,ay]=layerPx(p.id,L), [bx,by]=layerPx(q,L);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); }}}
    // nodes
    for(const p of here){
      const [x,y]=layerPx(p.id,L); const col=nodeColor(p.id,s);
      const big = p.id===s.current || s.results.includes(p.id);
      ctx.beginPath(); ctx.arc(x,y,big?6:3.5,0,7); ctx.fillStyle=col; ctx.fill();
      if(s.results.includes(p.id) && L===0){ ctx.lineWidth=2; ctx.strokeStyle=C.navy; ctx.stroke(); }
    }
    // query guide (vertical line at query.x) + marker on base band
    const qx = b.x+query.x*b.w;
    ctx.strokeStyle="rgba(28,53,94,0.35)"; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(qx,lb.y+2); ctx.lineTo(qx,lb.y+lb.h); ctx.stroke(); ctx.setLineDash([]);
  }
  // descent connector: current node across the bands it lives in
  ctx.strokeStyle=C.coral; ctx.setLineDash([3,3]); ctx.lineWidth=1.5;
  const lvl = nodes[s.current].level;
  for(let L=lvl; L>0; L--){
    const [x1,y1]=layerPx(s.current,L), [x2,y2]=layerPx(s.current,L-1);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.setLineDash([]);
  // query marker on the base band
  const lb0 = layerBox(0); const qx = b.x+query.x*b.w;
  drawQuery(qx, lb0.y+lb0.h*0.5, true);
}

function drawQuery(cx,cy,noLine){
  if(!noLine){
    const [qx,qy]=spacePx(query);
    ctx.strokeStyle="rgba(28,53,94,0.45)"; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(qx,qy); ctx.stroke(); ctx.setLineDash([]);
    cx=qx; cy=qy;
  }
  ctx.strokeStyle=C.navy; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cx-7,cy-7); ctx.lineTo(cx+7,cy+7);
  ctx.moveTo(cx+7,cy-7); ctx.lineTo(cx-7,cy+7); ctx.stroke();
}

// ===================== UI wiring =====================
function refreshCaption(){
  const s = steps[cur]||{};
  $("caption").textContent = s.caption || "";
  $("stepc").textContent = `Step ${cur+1} / ${steps.length}`;
  $("step").disabled = cur>=steps.length-1;
}
function render(){ draw(); refreshCaption(); }

function rebuild(){ stop(); cur=0; build(); render(); }
function research(){ stop(); cur=0; runSearch(); render(); }     // query/ef/k changed — no rebuild

function stepFwd(){ if(cur<steps.length-1){ cur++; render(); } else stop(); }
function play(){
  if(timer){ stop(); return; }
  if(cur>=steps.length-1) cur=0;
  $("play").textContent="⏸ Pause";
  timer=setInterval(()=>{ if(cur>=steps.length-1){ stop(); } else stepFwd(); }, 700);
}
function stop(){ if(timer){ clearInterval(timer); timer=null; } $("play").textContent="⏵ Play"; }

// view toggle
$("viewSeg").addEventListener("click", e=>{
  const btn=e.target.closest("button"); if(!btn) return;
  view=btn.dataset.view;
  [...$("viewSeg").children].forEach(b=>b.classList.toggle("on", b===btn));
  draw();
});
// sliders
function bindSlider(id, labelId, onChange){
  const el=$(id); el.addEventListener("input",()=>{ $(labelId).textContent=el.value; onChange(); });
}
bindSlider("n","nv",rebuild);
bindSlider("m","mv",rebuild);
bindSlider("ef","efv",research);
bindSlider("k","kv",research);
// buttons
$("reset").addEventListener("click",()=>{ stop(); cur=0; render(); });
$("step").addEventListener("click",()=>{ stop(); stepFwd(); });
$("play").addEventListener("click",play);
$("rebuild").addEventListener("click",()=>{ seed=(Math.random()*1e9)|0; rebuild(); });

// drag the query
let dragging=false;
function ptr(e){ const r=cv.getBoundingClientRect(); return {px:e.clientX-r.left, py:e.clientY-r.top}; }
function setQueryFrom(px,py){
  const b=plotBox();
  let nx=(px-b.x)/b.w, ny=(py-b.y)/b.h;
  query.x=Math.max(0,Math.min(1,nx));
  if(view==="space") query.y=Math.max(0,Math.min(1,ny));   // layers view: x only
  research();
  cur=steps.length-1; render();   // jump to result so it tracks the query live
}
cv.addEventListener("pointerdown",e=>{ dragging=true; cv.setPointerCapture(e.pointerId); const{px,py}=ptr(e); setQueryFrom(px,py); });
cv.addEventListener("pointermove",e=>{ if(!dragging) return; const{px,py}=ptr(e); setQueryFrom(px,py); });
cv.addEventListener("pointerup",  ()=>{ dragging=false; });

new ResizeObserver(()=>draw()).observe($("stage"));
window.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){stepFwd();} if(e.key===" "){e.preventDefault();play();} });

// ===================== go =====================
build(); render();
</script>
</body>
</html>
